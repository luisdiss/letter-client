[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "letter"
version = "0.1.0"
dependencies = [
    "requests==2.32.5",
    "bidict==0.23.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.11",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0"
]